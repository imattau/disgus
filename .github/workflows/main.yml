name: Production Deploy
on:
  push:
    branches:
      - main
jobs:
  prodDeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
#      - name: Release
#        run: yarn version minor && yarn release